[project]
name = "python-template"
version = "0.1.0"
description = "A minimal Python project template with a complete type-check, format, lint, and test toolchain"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["poethepoet>=0.48.0", "canonist>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Lint, format, test, and environment diagnostics come from canonist — one
# dev dependency that bundles ruff, pyright, pytest (+coverage), pip-audit,
# and the duplication gate, and ships the canonical tool presets.
#
# Poe auto-detects the uv virtualenv, so task commands run tools directly
# without an `uv run` prefix. Invoke tasks as `uv run poe <task>` (or
# `uv run python -m poethepoet <task>` on endpoints that block generated
# console-script launchers). Every task goes through `python -m <module>`
# rather than a console script, so nothing depends on generated
# entry-point launchers.
[tool.poe.tasks.lint]
help = "Full static pipeline via canonist"
cmd = "python -m canonist lint"

[tool.poe.tasks.format]
help = "Auto-format and auto-fix lint issues"
cmd = "python -m canonist format"

[tool.poe.tasks.test]
help = "Test suite with the coverage gate"
cmd = "python -m canonist test"

[tool.poe.tasks.doctor]
help = "Diagnose the environment"
cmd = "python -m canonist doctor"

[tool.poe.tasks.check]
help = "Everything: lint plus tests"
sequence = ["lint", "test"]

# Local deltas over canonist's bundled presets (deep-merged at invocation
# time: later keys win, lists replace, tables merge recursively). Keep this
# empty unless the repo genuinely deviates — rule and preset changes belong
# in canonist; bump its version to pick them up.
[tool.canonist.ruff.lint.per-file-ignores]
