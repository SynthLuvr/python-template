[project]
name = "python-template"
version = "0.1.0"
description = "A minimal Python project template with a complete type-check, format, lint, and test toolchain"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyright>=1.1.411",
    "ruff>=0.16.3",
    "poethepoet>=0.48.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TCH", "S"]

[tool.ruff.lint.per-file-ignores]
# `assert` is the standard assertion primitive in tests, not a security risk.
"src/tests/*" = ["S101"]
# The bootstrap script intentionally downloads and runs an external binary, so the
# bandit `S` rules (subprocess, network, archive extraction) do not apply.
"scripts/*" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"

# Poe auto-detects the uv virtualenv, so task commands run tools directly
# without an `uv run` prefix. Invoke tasks as `uv run poe <task>`.
# Tasks use `cmd` or `sequence` (not `shell`) so they run identically on
# Linux, macOS, and Windows with no dependency on a POSIX shell.
[tool.poe.tasks.typecheck]
help = "Strict type checking with Pyright"
cmd = "pyright src/"

[tool.poe.tasks.lint-check]
help = "Lint all files, including the bandit/SAST rule set"
cmd = "ruff check src/"

[tool.poe.tasks.format-check]
help = "Verify formatting without writing changes"
cmd = "ruff format --check src/"

[tool.poe.tasks.audit]
help = "Scan production dependencies for known vulnerabilities (SCA)"
cmd = "python scripts/audit_deps.py"

[tool.poe.tasks.duplicates]
help = "Fail if duplicated code exceeds the 5% threshold"
cmd = "python scripts/check_duplicates.py"

[tool.poe.tasks.test]
help = "Run the test suite with the 80% coverage gate"
cmd = "pytest"

[tool.poe.tasks.format]
help = "Auto-format and auto-fix lint issues (writes changes)"
sequence = [
    { cmd = "ruff format src/" },
    { cmd = "ruff check --fix src/" },
]

[tool.poe.tasks.lint]
help = "Full static pipeline (type-check + lint + format check + audit + duplicates)"
sequence = ["typecheck", "lint-check", "format-check", "audit", "duplicates"]

[tool.poe.tasks.check]
help = "Everything: the full lint pipeline plus the test suite"
sequence = ["lint", "test"]
