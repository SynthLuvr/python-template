[project]
name = "python-template"
version = "0.1.0"
description = "A minimal Python project template with a complete type-check, format, lint, and test toolchain"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "pip-audit>=2.7.3",
    "pytest>=9.1.1",
    "pytest-cov>=5.0.0",
    "pyright>=1.1.411",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TCH", "S"]

[tool.ruff.lint.per-file-ignores]
# `assert` is the standard assertion primitive in tests, not a security risk.
"src/tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
