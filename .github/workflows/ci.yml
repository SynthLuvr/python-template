name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to immutable commit SHAs (mutable tags can be retargeted or
      # deleted, and only the v-prefixed spellings exist as refs — an
      # unprefixed pin fails instantly at "Set up job"). The trailing
      # comments track the resolved versions.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        # --locked also fails the build if uv.lock is stale against pyproject.toml.
        run: uv sync --all-extras --locked

      - name: Lint
        run: uv run python -m poethepoet lint

      - name: Test
        run: uv run python -m poethepoet test
